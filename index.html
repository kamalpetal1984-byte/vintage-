<!DOCTYPE html>
<html lang="en" class="h-full bg-[#050806]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VINTAGE</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK Modules for Realtime Database & Auth -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, onSnapshot, setDoc, addDoc, updateDoc, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Firebase Config Initialization
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "demo-key",
          authDomain: "vintage-app.firebaseapp.com",
          projectId: "vintage-app",
          storageBucket: "vintage-app.appspot.com",
          messagingSenderId: "123456789",
          appId: typeof __app_id !== 'undefined' ? __app_id : 'vintage-squad-app'
        };

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'vintage-squad-app';
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.vintageDB = db;
    window.vintageAppId = appId;
    window.firebaseFS = { collection, doc, onSnapshot, setDoc, addDoc, updateDoc, deleteDoc, getDocs };

    // Setup Cross-Window & Cross-Device Sync Channel
    window.vintageChannel = new BroadcastChannel('vintage_realtime_sync');
    window.vintageChannel.onmessage = (event) => {
      if (event.data && event.data.type === 'DATA_UPDATED') {
        state.posts = getStored('posts', state.posts);
        state.messages = getStored('messages', state.messages);
        state.members = getStored('members', state.members);
        if (state.currentUser) renderApp();
      }
    };

    // Authenticate anonymously for secure Cloud Firestore Sync
    signInAnonymously(auth).then(() => {
      if (window.setupRealtimeListeners) {
        window.setupRealtimeListeners();
      }
    }).catch(err => {
      console.warn("Using offline memory mode fallback", err);
    });
  </script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: {
              DEFAULT: '#0B0F0E',
              deep: '#050806',
              card: '#101614',
              hover: '#18221F',
              border: '#1B2A24'
            },
            emerald: {
              glow: '#00FF87',
              accent: '#00CC6A',
              muted: '#047857',
              dark: '#023824'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          boxShadow: {
            'glow-sm': '0 0 10px rgba(0, 255, 135, 0.2)',
            'glow-md': '0 0 20px rgba(0, 255, 135, 0.35)',
            'glow-lg': '0 0 35px rgba(0, 255, 135, 0.5)',
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #050806;
    }
    ::-webkit-scrollbar-thumb {
      background: #1B2A24;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00FF87;
    }
    .emerald-glow-text {
      text-shadow: 0 0 12px rgba(0, 255, 135, 0.6);
    }
    .emerald-glow-border {
      box-shadow: 0 0 15px rgba(0, 255, 135, 0.25);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="h-full text-gray-200 font-sans antialiased bg-[#050806] selection:bg-emerald-glow selection:text-obsidian-deep overflow-hidden">

  <div id="app" class="h-full w-full flex flex-col">
    <!-- RENDERED VIA JS -->
  </div>

  <script>
    // --- APP CONFIG & DUAL-PASSCODE SYSTEM ---
    const CONFIG = {
      MEMBER_PASS: "SP2413",
      ADMIN_PASS: "SP165"
    };

    // Helper functions for localStorage persistence
    function getStored(key, fallback) {
      const stored = localStorage.getItem('vintage_' + key);
      return stored ? JSON.parse(stored) : fallback;
    }
    function setStored(key, val) {
      localStorage.setItem('vintage_' + key, JSON.stringify(val));
    }

    let state = {
      currentUser: getStored('currentUser', null), // Persistent login state
      activeTab: 'feed', // 'feed' | 'chat' | 'profile' | 'dm'
      activeStoryModal: null, // story object or null
      showCreatePostModal: false, // create post/video modal state
      activeReel: null, // full-screen video reel object
      activeDMUser: null, // target user object for 1-on-1 DM
      showNotificationsModal: false, // Full screen notifications modal for mobile clarity

      notifications: getStored('notifications', [
        { id: 1, text: "Welcome to Vintage Squad Network!", time: "Just now", read: false }
      ]),

      directMessages: getStored('directMessages', []),
      
      stories: getStored('stories', [
        { id: 1, author: "Shreyansh", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Shreyansh", image: "https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=800&auto=format&fit=crop", caption: "Vintage core system operational 🚀" }
      ]),

      posts: getStored('posts', [
        {
          id: 1,
          author: "Shreyansh",
          avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Shreyansh",
          role: "Admin",
          timestamp: "Recently",
          content: "Welcome to VINTAGE! Group network is active.",
          type: "image",
          media: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=800&auto=format&fit=crop",
          likes: 1,
          likedByMe: false,
          comments: []
        }
      ]),

      messages: getStored('messages', [
        { id: 1, sender: "Shreyansh", role: "Admin", text: "Welcome to the Vintage squad room!", timestamp: "12:00 PM", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Shreyansh" }
      ]),

      members: getStored('members', [
        { id: 'm_admin', name: 'Shreyansh', role: 'Admin', status: 'Active', joined: 'Owner', avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=Shreyansh' }
      ]),

      blockedList: getStored('blockedList', []),
      logs: getStored('logs', [
        { id: 1, text: "System initialized with Obsidian-Emerald Core v3.0", time: "10:00 AM" }
      ])
    };

    // Realtime Cloud Synchronization listeners across all devices
    window.setupRealtimeListeners = function() {
      if (!window.vintageDB || !window.firebaseFS) return;
      const { collection, onSnapshot } = window.firebaseFS;
      
      try {
        // Listen to cloud posts in Realtime
        const postsRef = collection(window.vintageDB, 'artifacts', window.vintageAppId, 'public', 'data', 'posts');
        onSnapshot(postsRef, (snapshot) => {
          const cloudPosts = [];
          snapshot.forEach(docSnap => cloudPosts.push(docSnap.data()));
          if (cloudPosts.length > 0) {
            cloudPosts.sort((a,b) => (b.id || 0) - (a.id || 0));
            state.posts = cloudPosts;
            setStored('posts', state.posts);
            if (state.currentUser) renderApp();
          }
        }, (err) => console.log("Cloud sync listener error:", err));

        // Listen to cloud squad chat messages in Realtime
        const chatRef = collection(window.vintageDB, 'artifacts', window.vintageAppId, 'public', 'data', 'messages');
        onSnapshot(chatRef, (snapshot) => {
          const cloudMsgs = [];
          snapshot.forEach(docSnap => cloudMsgs.push(docSnap.data()));
          if (cloudMsgs.length > 0) {
            cloudMsgs.sort((a,b) => (a.id || 0) - (b.id || 0));
            state.messages = cloudMsgs;
            setStored('messages', state.messages);
            if (state.currentUser) renderApp();
          }
        }, (err) => console.log("Cloud chat listener error:", err));

        // Listen to registered members list in Realtime
        const membersRef = collection(window.vintageDB, 'artifacts', window.vintageAppId, 'public', 'data', 'members');
        onSnapshot(membersRef, (snapshot) => {
          const cloudMembers = [];
          snapshot.forEach(docSnap => cloudMembers.push(docSnap.data()));
          if (cloudMembers.length > 0) {
            state.members = cloudMembers;
            setStored('members', state.members);
            if (state.currentUser) renderApp();
          }
        }, (err) => console.log("Members sync listener error:", err));
      } catch(e) {
        console.log("Local Storage Fallback Mode", e);
      }
    };

    function syncToCloud(collectionName, docId, data) {
      // Direct Local Broadcast to all active windows/tabs instantly
      if (window.vintageChannel) {
        window.vintageChannel.postMessage({ type: 'DATA_UPDATED' });
      }

      if (!window.vintageDB || !window.firebaseFS) return;
      try {
        const { doc, setDoc } = window.firebaseFS;
        const docRef = doc(window.vintageDB, 'artifacts', window.vintageAppId, 'public', 'data', collectionName, String(docId));
        setDoc(docRef, data, { merge: true }).then(() => {
          console.log("Cloud sync successful for", collectionName);
        }).catch(err => console.warn("Firestore Write Error:", err));
      } catch(e) {
        console.warn("Cloud write error:", e);
      }
    }

    function saveState() {
      setStored('currentUser', state.currentUser);
      setStored('stories', state.stories);
      setStored('posts', state.posts);
      setStored('messages', state.messages);
      setStored('members', state.members);
      setStored('blockedList', state.blockedList);
      setStored('logs', state.logs);
      setStored('notifications', state.notifications);
      setStored('directMessages', state.directMessages);

      if (window.vintageChannel) {
        window.vintageChannel.postMessage({ type: 'DATA_UPDATED' });
      }
    }

    function saveState() {
      setStored('currentUser', state.currentUser);
      setStored('stories', state.stories);
      setStored('posts', state.posts);
      setStored('messages', state.messages);
      setStored('members', state.members);
      setStored('blockedList', state.blockedList);
      setStored('logs', state.logs);
      setStored('notifications', state.notifications);
      setStored('directMessages', state.directMessages);
    }

    // --- AUTHENTICATION & LOGIN LOGIC ---
    function handleLogin(e) {
      e.preventDefault();
      const nameInput = document.getElementById('login-name').value.trim();
      const passInput = document.getElementById('login-pass').value.trim();
      const errorEl = document.getElementById('login-error');

      if (!nameInput) {
        showError(errorEl, "Please enter your name.");
        return;
      }

      if (state.blockedList.includes(nameInput.toLowerCase())) {
        showError(errorEl, "You have been blocked from accessing VINTAGE network.");
        return;
      }

      let assignedRole = null;
      if (passInput === CONFIG.ADMIN_PASS) {
        assignedRole = 'Admin';
      } else if (passInput === CONFIG.MEMBER_PASS) {
        assignedRole = 'Member';
      } else {
        showError(errorEl, "Invalid Secret Passcode! Access Denied.");
        addLog(`Failed passcode attempt by '${nameInput}'.`);
        return;
      }

      const existingMember = state.members.find(m => m.name.toLowerCase() === nameInput.toLowerCase());

      if (existingMember && existingMember.status === 'Suspended') {
        showError(errorEl, "Your account is currently suspended by Admin.");
        return;
      }

      const finalRole = assignedRole;
      const userAvatar = existingMember ? existingMember.avatar : `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(nameInput)}`;

      state.currentUser = {
        id: existingMember ? existingMember.id : 'u_' + Date.now(),
        name: nameInput,
        role: finalRole,
        avatar: userAvatar,
        bio: existingMember ? (existingMember.bio || "Vintage Member") : "Vintage Member",
        joined: 'Today'
      };

      if (!existingMember) {
        state.members.push({
          id: state.currentUser.id,
          name: nameInput,
          role: finalRole,
          status: 'Active',
          joined: 'Today',
          avatar: userAvatar,
          bio: state.currentUser.bio
        });
      } else {
        existingMember.role = finalRole;
      }

      saveState();
      addLog(`User '${nameInput}' authenticated as [${finalRole}].`);
      syncToCloud('members', state.currentUser.id, {
        id: state.currentUser.id,
        name: nameInput,
        role: finalRole,
        status: 'Active',
        joined: 'Today',
        avatar: userAvatar,
        bio: state.currentUser.bio
      });
      renderApp();
    }

    function showError(el, msg) {
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function handleLogout() {
      if (state.currentUser) {
        addLog(`User '${state.currentUser.name}' logged out.`);
      }
      state.currentUser = null;
      saveState();
      state.activeTab = 'feed';
      renderApp();
    }

    function switchTab(tab) {
      state.activeTab = tab;
      renderApp();
    }

    function addLog(msg) {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      state.logs.unshift({ id: Date.now(), text: msg, time: time });
      
      state.notifications.unshift({
        id: Date.now(),
        text: msg,
        time: time,
        read: false
      });

      saveState();
    }

    function toggleNotifications() {
      state.showNotificationsModal = !state.showNotificationsModal;
      if (state.showNotificationsModal) {
        state.notifications.forEach(n => n.read = true);
      }
      saveState();
      renderApp();
    }

    function openReel(postId) {
      const post = state.posts.find(p => p.id === postId);
      if (post && post.type === 'video') {
        state.activeReel = post;
        renderApp();
      }
    }

    function closeReel() {
      state.activeReel = null;
      renderApp();
    }

    function openStory(storyId) {
      const story = state.stories.find(s => s.id === storyId);
      if (story) {
        state.activeStoryModal = story;
        renderApp();
      }
    }

    function closeStory() {
      state.activeStoryModal = null;
      renderApp();
    }

    function openDMWith(userName) {
      if (!state.currentUser || state.currentUser.name === userName) return;
      const targetMember = state.members.find(m => m.name.toLowerCase() === userName.toLowerCase());
      if (targetMember) {
        state.activeDMUser = targetMember;
        state.activeTab = 'dm';
        renderApp();
      }
    }

    function sendDMMessage(e) {
      e.preventDefault();
      const input = document.getElementById('dm-input');
      const text = input.value.trim();
      if (!text || !state.activeDMUser) return;

      const newDm = {
        id: Date.now(),
        sender: state.currentUser.name,
        receiver: state.activeDMUser.name,
        text: text,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      state.directMessages.push(newDm);
      saveState();
      renderApp();
      setTimeout(() => {
        const dmBox = document.getElementById('dm-container');
        if (dmBox) dmBox.scrollTop = dmBox.scrollHeight;
      }, 50);
    }

    // --- CHANGE PROFILE PICTURE (NEW FEATURE) ---
    function triggerAvatarUpload() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const newAvatarData = event.target.result;
            
            // 1. Update current logged-in user avatar
            state.currentUser.avatar = newAvatarData;
            
            // 2. Update member object
            const member = state.members.find(m => m.name.toLowerCase() === state.currentUser.name.toLowerCase());
            if (member) member.avatar = newAvatarData;

            // 3. Sync past posts & comments avatar
            state.posts.forEach(p => {
              if (p.author.toLowerCase() === state.currentUser.name.toLowerCase()) {
                p.avatar = newAvatarData;
              }
            });

            // 4. Sync stories avatar
            state.stories.forEach(s => {
              if (s.author.toLowerCase() === state.currentUser.name.toLowerCase()) {
                s.avatar = newAvatarData;
              }
            });

            // 5. Sync chat messages avatar
            state.messages.forEach(m => {
              if (m.sender.toLowerCase() === state.currentUser.name.toLowerCase()) {
                m.avatar = newAvatarData;
              }
            });

            saveState();
            addLog(`Profile photo updated by ${state.currentUser.name}`);
            renderApp();
          };
          reader.readAsDataURL(file);
        }
      };
      input.click();
    }

    function saveProfileEdit(e) {
      e.preventDefault();
      const newBio = document.getElementById('profile-bio-input').value.trim();
      const avatarFile = document.getElementById('profile-avatar-file').files[0];

      if (state.currentUser) {
        state.currentUser.bio = newBio || "Vintage Member";
        
        if (avatarFile) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            state.currentUser.avatar = ev.target.result;
            updateMemberProfileData();
          };
          reader.readAsDataURL(avatarFile);
        } else {
          updateMemberProfileData();
        }
      }
    }

    function updateMemberProfileData() {
      const member = state.members.find(m => m.name.toLowerCase() === state.currentUser.name.toLowerCase());
      if (member) {
        member.bio = state.currentUser.bio;
        member.avatar = state.currentUser.avatar;
      }
      saveState();
      addLog(`Profile updated by ${state.currentUser.name}`);
      alert("Profile updated successfully!");
      renderApp();
    }

    function triggerStoryUpload() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const cap = prompt("Story caption (Optional):");
            const newStory = {
              id: Date.now(),
              author: state.currentUser.name,
              avatar: state.currentUser.avatar,
              image: event.target.result,
              caption: cap || "Vintage Spotlight"
            };
            state.stories.unshift(newStory);
            saveState();
            addLog(`New Photo Story added by ${state.currentUser.name}`);
            renderApp();
          };
          reader.readAsDataURL(file);
        }
      };
      input.click();
    }

    function toggleCreatePostModal(show) {
      state.showCreatePostModal = show;
      renderApp();
    }

    function handleCreateContent(type) {
      if (type === 'text') {
        const text = prompt("Apna Text Status / Post likhein:");
        if (!text) return;
        saveNewPost(text, null, "text");
      } else if (type === 'photo') {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (ev) => {
              const cap = prompt("Photo post description/caption:");
              saveNewPost(cap || "", ev.target.result, "image");
            };
            reader.readAsDataURL(file);
          }
        };
        input.click();
      } else if (type === 'video') {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'video/*';
        input.onchange = (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (ev) => {
              const cap = prompt("Video / Reel description:");
              saveNewPost(cap || "", ev.target.result, "video");
            };
            reader.readAsDataURL(file);
          }
        };
        input.click();
      }
    }

    function saveNewPost(content, mediaData, postType) {
      const newPost = {
        id: Date.now(),
        author: state.currentUser.name,
        avatar: state.currentUser.avatar,
        role: state.currentUser.role,
        timestamp: "Just now",
        content: content,
        type: postType,
        media: mediaData,
        likes: 0,
        likedByMe: false,
        comments: []
      };

      state.posts.unshift(newPost);
      state.showCreatePostModal = false;
      saveState();
      syncToCloud('posts', newPost.id, newPost);
      addLog(`New ${postType} created by ${state.currentUser.name}`);
      renderApp();
    }

    function createPost(e) {
      e.preventDefault();
      const text = document.getElementById('modal-post-text').value.trim();
      const fileInput = document.getElementById('modal-post-media-file');
      const isVideo = document.getElementById('modal-post-is-video').checked;
      const file = fileInput.files[0];

      if (!text && !file) return;

      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          saveNewPost(text, ev.target.result, isVideo ? 'video' : 'image');
          toggleCreatePostModal(false);
        };
        reader.readAsDataURL(file);
      } else {
        saveNewPost(text, null, 'text');
        toggleCreatePostModal(false);
      }
    }

    function toggleLike(postId) {
      const post = state.posts.find(p => p.id === postId);
      if (post) {
        post.likedByMe = !post.likedByMe;
        post.likes += post.likedByMe ? 1 : -1;
        saveState();
        syncToCloud('posts', post.id, post);
        renderApp();
      }
    }

    function addComment(e, postId) {
      e.preventDefault();
      const input = document.getElementById(`comment-input-${postId}`);
      const text = input.value.trim();
      if (!text) return;

      const post = state.posts.find(p => p.id === postId);
      if (post) {
        post.comments.push({
          id: Date.now(),
          author: state.currentUser.name,
          text: text,
          timestamp: "Just now"
        });
        saveState();
        syncToCloud('posts', post.id, post);
        renderApp();
      }
    }

    function addComment(e, postId) {
      e.preventDefault();
      const input = document.getElementById(`comment-input-${postId}`);
      const text = input.value.trim();
      if (!text) return;

      const post = state.posts.find(p => p.id === postId);
      if (post) {
        post.comments.push({
          id: Date.now(),
          author: state.currentUser.name,
          text: text,
          timestamp: "Just now"
        });
        saveState();
        renderApp();
      }
    }

    function deletePost(postId) {
      if (state.currentUser.role !== 'Admin') return;
      if (confirm("Admin Action: Delete this post?")) {
        state.posts = state.posts.filter(p => p.id !== postId);
        saveState();
        addLog(`Post ID ${postId} removed by Admin.`);
        renderApp();
      }
    }

    function sendChatMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const newMsg = {
        id: Date.now(),
        sender: state.currentUser.name,
        role: state.currentUser.role,
        text: text,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        avatar: state.currentUser.avatar
      };

      state.messages.push(newMsg);
      saveState();
      syncToCloud('messages', newMsg.id, newMsg);
      renderApp();
      setTimeout(() => {
        const chatBox = document.getElementById('chat-container');
        if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
      }, 50);
    }

    function toggleUserRole(memberId) {
      if (state.currentUser.role !== 'Admin') return;
      const member = state.members.find(m => m.id === memberId);
      if (!member) return;
      member.role = member.role === 'Admin' ? 'Member' : 'Admin';
      saveState();
      addLog(`Member '${member.name}' role updated to ${member.role}`);
      renderApp();
    }

    function toggleUserStatus(memberId) {
      if (state.currentUser.role !== 'Admin') return;
      const member = state.members.find(m => m.id === memberId);
      if (!member) return;
      member.status = member.status === 'Active' ? 'Suspended' : 'Active';
      
      if (state.currentUser && state.currentUser.name.toLowerCase() === member.name.toLowerCase() && member.status === 'Suspended') {
        state.currentUser = null;
      }

      saveState();
      addLog(`Member '${member.name}' status set to ${member.status}`);
      renderApp();
    }

    function blockUser(memberId) {
      if (state.currentUser.role !== 'Admin') return;
      const member = state.members.find(m => m.id === memberId);
      if (!member) return;
      if (confirm(`Block ${member.name} completely from accessing Vintage?`)) {
        state.blockedList.push(member.name.toLowerCase());
        
        if (state.currentUser && state.currentUser.name.toLowerCase() === member.name.toLowerCase()) {
          state.currentUser = null;
        }

        state.members = state.members.filter(m => m.id !== memberId);
        saveState();
        addLog(`User '${member.name}' WAS PERMANENTLY BLOCKED.`);
        renderApp();
      }
    }

    function unblockName(name) {
      if (state.currentUser.role !== 'Admin') return;
      state.blockedList = state.blockedList.filter(n => n !== name);
      saveState();
      addLog(`User '${name}' unblocked.`);
      renderApp();
    }

    // --- RENDER LOGIN SCREEN (FIXED MISSING FUNCTION) ---

            <div class="text-center space-y-2">

                  </span>
                  <input type="text" id="login-name" required placeholder="Enter your name..."
                    class="w-full bg-obsidian-deep border border-obsidian-border rounded-xl pl-9 pr-4 py-2.5 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-emerald-glow">

                    <i class="fa-solid fa-key"></i>
                  </span>
                  <input type="password" id="login-pass" required placeholder="Enter secret passcode..."

    // --- RENDER SPOTLIGHTS / STORIES BAR ---
    function renderSpotlightsBar() {
      return `
        <div class="px-3 py-2 flex items-center space-x-3 overflow-x-auto no-scrollbar border-t border-obsidian-border/50 bg-obsidian-deep/40">

          <div onclick="triggerStoryUpload()" class="flex flex-col items-center space-y-1 shrink-0 cursor-pointer group">

              <i class="fa-solid fa-plus text-emerald-glow text-sm"></i>
            </div>
            <span class="text-[9px] font-mono text-gray-400">Add Story</span>
          </div>

          <!-- Existing Stories -->
          ${state.stories.map(s => `
            <div onclick="openStory(${s.id})" class="flex flex-col items-center space-y-1 shrink-0 cursor-pointer">
              <div class="w-12 h-12 rounded-full p-0.5 border-2 border-emerald-glow shadow-glow-sm bg-obsidian overflow-hidden">
                <img src="${s.image || s.avatar}" class="w-full h-full rounded-full object-cover">

    function sendVoiceNoteSimulated() {
      if (!state.currentUser) return;
      const newMsg = {
        id: Date.now(),
        sender: state.currentUser.name,
        role: state.currentUser.role,
        text: "🎙️ Voice Note (0:08) - Simulated Audio Message",
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        avatar: state.currentUser.avatar
      };
      state.messages.push(newMsg);
      saveState();
      renderApp();
      setTimeout(() => {
        const chatBox = document.getElementById('chat-container');
        if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
      }, 50);
    }

    // --- RENDER MAIN LAYOUT ---
    function renderApp() {
      const container = document.getElementById('app');

      if (state.currentUser) {
        const isBlocked = state.blockedList.includes(state.currentUser.name.toLowerCase());
        const memberInfo = state.members.find(m => m.name.toLowerCase() === state.currentUser.name.toLowerCase());
        const isSuspended = memberInfo && memberInfo.status === 'Suspended';

        if (isBlocked || isSuspended) {
          state.currentUser = null;
          saveState();
        }
      }

      if (!state.currentUser) {
        container.innerHTML = renderLoginScreen();
        return;
      }

      const unreadCount = state.notifications.filter(n => !n.read).length;

      container.innerHTML = `
        <div class="flex flex-col h-full bg-[#050806] relative">
          <!-- TOP BRAND HEADER & SPOTLIGHT STORIES BAR -->
          <header class="bg-obsidian border-b border-obsidian-border shrink-0 z-20">

              <div class="flex items-center space-x-2 cursor-pointer" onclick="switchTab('feed')">
                <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-obsidian-deep border border-emerald-glow/40 flex items-center justify-center text-emerald-glow shadow-glow-sm">
                  <i class="fa-solid fa-gem text-xs sm:text-base"></i>
                </div>
                <h1 class="font-extrabold text-white text-base sm:text-lg tracking-wider">VINTAGE</h1>
              </div>

              <!-- HEADER ACTIONS (NOTIFICATION BELL + LOGOUT) -->
              <div class="flex items-center space-x-2 sm:space-x-3">
                <!-- NOTIFICATION BELL ICON -->
                <button onclick="toggleNotifications()" class="p-2 text-gray-300 hover:text-emerald-glow transition relative active:scale-95">
                  <i class="fa-solid fa-bell text-lg"></i>
                  ${unreadCount > 0 ? `
                    <span class="absolute top-1 right-1 w-4 h-4 bg-emerald-glow text-obsidian-deep text-[9px] font-bold rounded-full flex items-center justify-center shadow-glow-sm">
                      ${unreadCount}
                    </span>
                  ` : ''}
                </button>

                <span class="text-[9px] sm:text-[10px] font-mono px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-full ${state.currentUser.role === 'Admin' ? 'bg-emerald-glow/20 text-emerald-glow border border-emerald-glow/40 font-bold' : 'bg-gray-800 text-gray-400'}">
                  ${state.currentUser.role}
                </span>
                <button onclick="handleLogout()" class="p-2 text-gray-400 hover:text-red-400 transition text-sm" title="Logout">
                  <i class="fa-solid fa-right-from-bracket"></i>
                </button>
              </div>
            </div>

            <!-- INSTAGRAM / SPOTLIGHT STORIES CIRCLE BAR -->
            ${renderSpotlightsBar()}
          </header>

          <!-- MAIN TAB CONTENT CONTAINER -->
          <main class="flex-1 overflow-y-auto p-3 sm:p-5 pb-24 relative max-w-3xl mx-auto w-full">
            ${renderActiveTabContent()}
          </main>

          <!-- BOTTOM ACTION NAVIGATION BAR -->
          ${renderBottomTabBar()}

          <!-- FULL SCREEN NOTIFICATION SECTION MODAL -->
          ${state.showNotificationsModal ? renderFullNotificationModal() : ''}

          <!-- STORY MODAL IF ACTIVE -->
          ${state.activeStoryModal ? renderStoryModal() : ''}

          <!-- CREATE POST FLOATING MODAL -->
          ${state.showCreatePostModal ? renderCreatePostModal() : ''}

          <!-- FULL-SCREEN REELS MODAL -->
          ${state.activeReel ? renderFullScreenReelModal() : ''}
        </div>
      `;
    }

    // --- FULL NOTIFICATION SECTION MODAL FOR MOBILE ---
    function renderFullNotificationModal() {
      return `
        <div class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col p-4 max-w-lg mx-auto">
          <!-- Modal Header -->
          <div class="flex items-center justify-between border-b border-obsidian-border pb-3 mb-4">
            <div class="flex items-center space-x-2 text-emerald-glow">
              <i class="fa-solid fa-bell text-lg"></i>
              <h2 class="text-base font-bold text-white font-mono uppercase tracking-wider">Notifications & Alerts</h2>

      return `
        <div class="fixed bottom-0 left-0 right-0 h-16 bg-obsidian/95 border-t border-obsidian-border backdrop-blur-lg z-30 flex items-center justify-between px-4 max-w-4xl mx-auto">
          <button onclick="switchTab('feed')" class="flex-1 h-full flex flex-col items-center justify-center space-y-1 transition ${state.activeTab === 'feed' ? activeClass : inactiveClass}">
            <i class="fa-solid fa-clapperboard text-lg"></i>
            <span class="text-[10px] font-mono">Feed</span>

          <button onclick="switchTab('chat')" class="flex-1 h-full flex flex-col items-center justify-center space-y-1 transition ${state.activeTab === 'chat' ? activeClass : inactiveClass}">

    function renderActiveTabContent() {
      switch (state.activeTab) {

        case 'chat': return renderChatSection();
        case 'profile': return renderProfileAndAdminSection();
        case 'dm': return renderDMSection();

    function renderFeedSection() {

        <div class="max-w-2xl mx-auto space-y-6">
          <div class="space-y-5">
            ${state.posts.map(post => `
              <div class="bg-obsidian-card border border-obsidian-border rounded-2xl p-4 sm:p-5 space-y-4 shadow-md">

    function renderChatSection() {

              <span class="w-2.5 h-2.5 rounded-full bg-emerald-glow animate-ping"></span>

            </div>
          </div>

          <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-3">

                <div class="flex items-start space-x-2.5 ${isMe ? 'flex-row-reverse space-x-reverse' : ''}">
                  <img src="${msg.avatar}" onclick="openDMWith('${msg.sender}')" class="w-7 h-7 rounded-full border border-emerald-glow/30 bg-obsidian shrink-0 cursor-pointer object-cover">

                    <div class="p-3 rounded-2xl text-xs leading-relaxed ${
                      isMe 
                        ? 'bg-emerald-dark/50 border border-emerald-glow/30 text-white rounded-tr-none'

                      : 'bg-obsidian-deep border border-obsidian-border text-gray-200 rounded-bl-none'

                    <p>${m.text}</p>
                    <span class="block text-[8px] text-right text-gray-400 font-mono">${m.timestamp}</span>

            <button type="submit" class="px-4 py-2.5 bg-emerald-glow text-obsidian-deep font-bold text-xs rounded-xl">
              <i class="fa-solid fa-paper-plane"></i>

    // --- PROFILE & ADMIN PANEL WITH CHANGE AVATAR ---
    function renderProfileAndAdminSection() {
      const u = state.currentUser;
      return `
        <div class="max-w-2xl mx-auto space-y-5">
          <!-- Profile Customization Card -->
          <div class="bg-obsidian-card border border-obsidian-border rounded-2xl p-4 sm:p-5 shadow-lg space-y-4">
            <div class="flex flex-col sm:flex-row items-center space-y-3 sm:space-y-0 sm:space-x-5 text-center sm:text-left">
              <div class="relative group cursor-pointer" onclick="triggerAvatarUpload()" title="Click to change profile picture">
                <img src="${u.avatar}" class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl border-2 border-emerald-glow p-1 bg-obsidian shadow-glow-sm object-cover">
                <div class="absolute inset-0 bg-black/60 rounded-2xl flex items-center justify-center opacity-0 group-hover:opacity-100 transition text-emerald-glow text-xs font-mono">
                  Change
                </div>
              </div>
              
              <div class="space-y-1 flex-1">
                <div class="flex items-center justify-center sm:justify-start space-x-2">
                  <h2 class="text-base sm:text-lg font-bold text-white">${u.name}</h2>
                  <span class="text-[10px] font-mono px-2 py-0.5 rounded-full ${u.role === 'Admin' ? 'bg-emerald-glow/20 text-emerald-glow border border-emerald-glow/40' : 'bg-gray-800 text-gray-400'}">
                    ${u.role}
                  </span>
                </div>
                <p class="text-xs text-emerald-glow font-mono">${u.bio || 'Vintage Squad Member'}</p>
              </div>
            </div>

            <!-- Profile Edit Form -->
            <form onsubmit="saveProfileEdit(event)" class="border-t border-obsidian-border pt-4 space-y-3">
              <div>
                <label class="block text-[10px] font-mono text-gray-400 uppercase mb-1">Upload New Profile Picture</label>
                <input type="file" id="profile-avatar-file" accept="image/*"
                  class="w-full bg-obsidian-deep border border-obsidian-border rounded-xl p-1.5 text-xs text-gray-400 file:mr-3 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-[11px] file:font-semibold file:bg-emerald-glow file:text-obsidian-deep">
              </div>

              <div>
                <label class="block text-[10px] font-mono text-gray-400 uppercase mb-1">Status Bio</label>
                <div class="flex space-x-2">
                  <input type="text" id="profile-bio-input" placeholder="Update your Status Bio..." value="${u.bio || ''}"
                    class="flex-1 bg-obsidian-deep border border-obsidian-border rounded-xl px-3 py-2 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-emerald-glow">
                  <button type="submit" class="px-4 py-2 bg-emerald-glow/20 border border-emerald-glow/40 text-emerald-glow text-xs font-bold rounded-xl hover:bg-emerald-glow hover:text-obsidian-deep transition shrink-0">
                    Save Profile
                  </button>
                </div>
              </div>
            </form>
          </div>

          <!-- ADMIN PANEL -->
          ${u.role === 'Admin' ? `
            <div class="bg-obsidian-card border border-emerald-glow/30 rounded-2xl p-4 sm:p-5 space-y-4 shadow-glow-sm">
              <div class="flex items-center space-x-2 text-emerald-glow border-b border-obsidian-border pb-3">
                <i class="fa-solid fa-user-shield text-base"></i>
                <h3 class="text-xs sm:text-sm font-bold tracking-wide uppercase font-mono">Admin Command Center</h3>
              </div>

              <!-- Registered Squad Members -->
              <div class="space-y-3">
                <h4 class="text-[10px] font-mono text-gray-400 uppercase">Squad Members Management</h4>
                <div class="space-y-2">
                  ${state.members.map(m => `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between p-3 rounded-xl bg-obsidian-deep border border-obsidian-border text-xs gap-2">
                      <div class="flex items-center space-x-3 cursor-pointer" onclick="openDMWith('${m.name}')">
                        <img src="${m.avatar}" class="w-8 h-8 rounded-full bg-obsidian object-cover">
                        <div>
                          <div class="flex items-center space-x-2">
                            <span class="font-bold text-white hover:text-emerald-glow">${m.name}</span>
                            <span class="text-[9px] font-mono px-1.5 py-0.5 rounded ${m.role === 'Admin' ? 'bg-emerald-glow/20 text-emerald-glow' : 'bg-gray-800 text-gray-400'}">${m.role}</span>
                          </div>
                          <span class="text-[10px] ${m.status === 'Active' ? 'text-emerald-glow' : 'text-red-400'}">${m.status}</span>
                        </div>
                      </div>

                      <div class="flex items-center space-x-1.5 self-end sm:self-auto">
                        <button onclick="toggleUserRole('${m.id}')" class="px-2 py-1 bg-obsidian border border-obsidian-border text-gray-300 rounded font-mono text-[9px]">
                          ${m.role === 'Admin' ? 'Demote' : 'Promote'}
                        </button>
                        <button onclick="toggleUserStatus('${m.id}')" class="px-2 py-1 bg-obsidian border border-obsidian-border text-amber-300 rounded font-mono text-[9px]">
                          ${m.status === 'Active' ? 'Suspend' : 'Activate'}
                        </button>
                        <button onclick="blockUser('${m.id}')" class="px-2 py-1 bg-red-950/40 border border-red-800/40 text-red-400 rounded font-mono text-[9px]">
                          Block
                        </button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderFullScreenReelModal() {
      const r = state.activeReel;
      if (!r) return '';

      return `
        <div class="fixed inset-0 z-50 bg-black flex items-center justify-center">
          <button onclick="closeReel()" class="absolute top-4 right-4 z-50 text-white text-2xl font-bold p-2 bg-black/60 rounded-full w-10 h-10 flex items-center justify-center">
            &times;
          </button>

          <div class="w-full max-w-sm h-full max-h-[90vh] relative bg-black flex items-center justify-center border border-obsidian-border rounded-3xl overflow-hidden shadow-2xl">
            <video controls autoplay class="w-full h-full object-cover">
              <source src="${r.media}">
            </video>

            <div class="absolute bottom-6 left-4 right-4 space-y-2 pointer-events-none">
              <div class="flex items-center space-x-2">
                <img src="${r.avatar}" class="w-8 h-8 rounded-full border border-emerald-glow object-cover">
                <span class="text-xs font-bold text-white drop-shadow">${r.author}</span>
              </div>
              <p class="text-xs text-gray-200 drop-shadow">${r.content}</p>
            </div>
          </div>
        </div>
      `;
    }

    function renderCreatePostModal() {
      return `
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="w-full max-w-lg bg-obsidian-card border border-emerald-glow/40 rounded-2xl p-5 space-y-4 shadow-glow-lg">
            <div class="flex items-center justify-between border-b border-obsidian-border pb-3">
              <h3 class="text-sm font-bold text-white flex items-center space-x-2">
                <i class="fa-solid fa-square-plus text-emerald-glow"></i>
                <span>Create New Post or Video</span>
              </h3>
              <button onclick="toggleCreatePostModal(false)" class="text-gray-400 hover:text-white text-lg font-bold">
                &times;
              </button>
            </div>

            <div class="grid grid-cols-3 gap-2 pb-2">
              <button onclick="handleCreateContent('video')" class="p-3 rounded-xl border border-emerald-glow/30 bg-obsidian-deep hover:bg-emerald-glow/10 text-center transition">
                <i class="fa-solid fa-video text-emerald-glow text-lg block mb-1"></i>
                <span class="text-[11px] font-medium text-white">Post Reels</span>
              </button>
              <button onclick="handleCreateContent('photo')" class="p-3 rounded-xl border border-emerald-glow/30 bg-obsidian-deep hover:bg-emerald-glow/10 text-center transition">
                <i class="fa-solid fa-image text-emerald-glow text-lg block mb-1"></i>
                <span class="text-[11px] font-medium text-white">Post Photos</span>
              </button>
              <button onclick="handleCreateContent('text')" class="p-3 rounded-xl border border-emerald-glow/30 bg-obsidian-deep hover:bg-emerald-glow/10 text-center transition">
                <i class="fa-solid fa-font text-emerald-glow text-lg block mb-1"></i>
                <span class="text-[11px] font-medium text-white">Text Update</span>
              </button>
            </div>

            <form onsubmit="createPost(event)" class="space-y-4 border-t border-obsidian-border pt-3">
              <div>
                <label class="block text-xs font-mono text-gray-400 mb-1">Caption / Thoughts</label>
                <textarea id="modal-post-text" rows="3" placeholder="Share something cool with Vintage..."
                  class="w-full bg-obsidian-deep border border-obsidian-border rounded-xl p-3 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-emerald-glow resize-none"></textarea>
              </div>

              <div>
                <label class="block text-xs font-mono text-gray-400 mb-1">Select Media File</label>
                <input type="file" id="modal-post-media-file" accept="image/*,video/*"
                  class="w-full bg-obsidian-deep border border-obsidian-border rounded-xl p-2 text-xs text-gray-400 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-glow file:text-obsidian-deep">
              </div>

              <div class="flex items-center space-x-2 pt-1">
                <input type="checkbox" id="modal-post-is-video" class="accent-emerald-glow rounded w-4 h-4">
                <label for="modal-post-is-video" class="text-xs text-gray-300 font-mono">This media is a Video file</label>
              </div>

              <div class="flex justify-end space-x-3 pt-2">
                <button type="button" onclick="toggleCreatePostModal(false)" class="px-4 py-2 bg-obsidian-deep text-gray-400 text-xs rounded-xl border border-obsidian-border">
                  Cancel
                </button>
                <button type="submit" class="px-5 py-2 bg-emerald-glow text-obsidian-deep text-xs font-bold rounded-xl shadow-glow-sm hover:bg-emerald-accent transition">
                  Publish Post
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderStoryModal() {
      const s = state.activeStoryModal;
      if (!s) return '';
      return `
        <div class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
          <div class="w-full max-w-sm bg-obsidian-card border border-emerald-glow/40 rounded-3xl overflow-hidden shadow-glow-lg flex flex-col relative">
            <div class="p-3 flex items-center justify-between border-b border-obsidian-border bg-obsidian/80">
              <div class="flex items-center space-x-2.5">
                <img src="${s.avatar}" class="w-7 h-7 rounded-full border border-emerald-glow/40 object-cover">
                <span class="text-xs font-bold text-white">${s.author}</span>
              </div>
              <button onclick="closeStory()" class="text-gray-400 hover:text-white px-2 text-lg font-bold">
                &times;
              </button>
            </div>
            <div class="relative bg-black flex items-center justify-center min-h-[350px]">
              <img src="${s.image}" class="w-full max-h-[480px] object-contain">
            </div>
            ${s.caption ? `<div class="p-3 bg-obsidian text-center text-xs text-emerald-glow font-medium">${s.caption}</div>` : ''}
          </div>
        </div>
      `;
    }

    // --- INITIAL LAUNCH ---
    window.onload = function() {
      renderApp();
    };
  </script>
</body>
</html>
