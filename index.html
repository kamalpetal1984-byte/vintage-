<!DOCTYPE html>
<html lang="en" class="h-full bg-[#050806]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VINTAGE - Squad Network</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: {
              DEFAULT: '#0B0F0E',
              deep: '#050806',
              card: '#101614',
              hover: '#18221F',
              border: '#1B2A24'
            },
            emerald: {
              glow: '#00FF87',
              accent: '#00CC6A',
              muted: '#047857',
              dark: '#023824'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          boxShadow: {
            'glow-sm': '0 0 10px rgba(0, 255, 135, 0.2)',
            'glow-md': '0 0 20px rgba(0, 255, 135, 0.35)',
            'glow-lg': '0 0 35px rgba(0, 255, 135, 0.5)',
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #050806;
    }
    ::-webkit-scrollbar-thumb {
      background: #1B2A24;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00FF87;
    }
    .emerald-glow-text {
      text-shadow: 0 0 12px rgba(0, 255, 135, 0.6);
    }
    .emerald-glow-border {
      box-shadow: 0 0 15px rgba(0, 255, 135, 0.25);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="h-full text-gray-200 font-sans antialiased bg-[#050806] selection:bg-emerald-glow selection:text-obsidian-deep overflow-hidden">

  <div id="app" class="h-full w-full flex flex-col">
    <!-- RENDERED VIA JS -->
  </div>

  <script>
    // --- APP CONFIG & DUAL-PASSCODE SYSTEM ---
    const CONFIG = {
      MEMBER_PASS: "SP2413",
      ADMIN_PASS: "SP165"
    };

    // Helper functions for localStorage persistence
    function getStored(key, fallback) {
      const stored = localStorage.getItem('vintage_' + key);
      return stored ? JSON.parse(stored) : fallback;
    }
    function setStored(key, val) {
      localStorage.setItem('vintage_' + key, JSON.stringify(val));
    }

    let state = {
      currentUser: getStored('currentUser', null), // Persistent login state
      activeTab: 'feed', // 'feed' | 'chat' | 'profile' | 'dm'
      activeStoryModal: null, // story object or null
      showCreateModal: false, // create post/video modal state
      activeReel: null, // full-screen video reel object
      activeDMUser: null, // target user object for 1-on-1 DM
      showNotifications: false,

      // Notifications stored in localStorage
      notifications: getStored('notifications', [
        { id: 1, text: "Welcome to Vintage Squad Network!", time: "Just now", read: false }
      ]),

      // Direct Messages stored in localStorage
      directMessages: getStored('directMessages', []),
      
      // Dynamic Stories stored in localStorage
      stories: getStored('stories', [
        { id: 1, author: "Shreyansh", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Shreyansh", image: "https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=800&auto=format&fit=crop", caption: "Vintage core system operational 🚀" }
      ]),

      // Dynamic Posts stored in localStorage
      posts: getStored('posts', [
        {
          id: 1,
          author: "Shreyansh",
          avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Shreyansh",
          role: "Admin",
          timestamp: "Recently",
          content: "Welcome to VINTAGE! Group network is active.",
          type: "image",
          media: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=800&auto=format&fit=crop",
          likes: 1,
          likedByMe: false,
          comments: []
        }
      ]),

      // Dynamic Messages stored in localStorage
      messages: getStored('messages', [
        { id: 1, sender: "Shreyansh", role: "Admin", text: "Welcome to the Vintage squad room!", timestamp: "12:00 PM", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Shreyansh" }
      ]),

      // Dynamic Group Members (No dummy users)
      members: getStored('members', [
        { id: 'm_admin', name: 'Shreyansh', role: 'Admin', status: 'Active', joined: 'Owner', avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=Shreyansh' }
      ]),

      blockedList: getStored('blockedList', []),
      logs: getStored('logs', [
        { id: 1, text: "System initialized with Obsidian-Emerald Core v3.0", time: "10:00 AM" }
      ])
    };

    function saveState() {
      setStored('currentUser', state.currentUser);
      setStored('stories', state.stories);
      setStored('posts', state.posts);
      setStored('messages', state.messages);
      setStored('members', state.members);
      setStored('blockedList', state.blockedList);
      setStored('logs', state.logs);
    }

    // --- AUTHENTICATION & LOGIN LOGIC ---
    function handleLogin(e) {
      e.preventDefault();
      const nameInput = document.getElementById('login-name').value.trim();
      const passInput = document.getElementById('login-pass').value.trim();
      const errorEl = document.getElementById('login-error');

      if (!nameInput) {
        showError(errorEl, "Please enter your name.");
        return;
      }

      if (state.blockedList.includes(nameInput.toLowerCase())) {
        showError(errorEl, "You have been blocked from accessing VINTAGE network.");
        return;
      }

      let assignedRole = null;
      if (passInput === CONFIG.ADMIN_PASS) {
        assignedRole = 'Admin';
      } else if (passInput === CONFIG.MEMBER_PASS) {
        assignedRole = 'Member';
      } else {
        showError(errorEl, "Invalid Secret Passcode! Access Denied.");
        addLog(`Failed passcode attempt by '${nameInput}'.`);
        return;
      }

      const existingMember = state.members.find(m => m.name.toLowerCase() === nameInput.toLowerCase());

      if (existingMember && existingMember.status === 'Suspended') {
        showError(errorEl, "Your account is currently suspended by Admin.");
        return;
      }

      const finalRole = assignedRole; // Assign exact role derived from passcode entered
      const userAvatar = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(nameInput)}`;

      state.currentUser = {
        id: existingMember ? existingMember.id : 'u_' + Date.now(),
        name: nameInput,
        role: finalRole,
        avatar: userAvatar,
        joined: 'Today'
      };

      if (!existingMember) {
        state.members.push({
          id: state.currentUser.id,
          name: nameInput,
          role: finalRole,
          status: 'Active',
          joined: 'Today',
          avatar: userAvatar
        });
      } else {
        // Update role dynamically based on used passcode
        existingMember.role = finalRole;
      }

      saveState();
      addLog(`User '${nameInput}' authenticated as [${finalRole}].`);
      renderApp();
    }

    function showError(el, msg) {
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function handleLogout() {
      if (state.currentUser) {
        addLog(`User '${state.currentUser.name}' logged out.`);
      }
      state.currentUser = null;
      saveState();
      state.activeTab = 'feed';
      renderApp();
    }

    function switchTab(tab) {
      state.activeTab = tab;
      renderApp();
    }

    function addLog(msg) {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      state.logs.unshift({ id: Date.now(), text: msg, time: time });
      
      // Auto push notification
      state.notifications.unshift({
        id: Date.now(),
        text: msg,
        time: time,
        read: false
      });

      saveState();
    }

    function toggleNotifications() {
      state.showNotifications = !state.showNotifications;
      if (!state.showNotifications) {
        state.notifications.forEach(n => n.read = true);
      }
      saveState();
      renderApp();
    }

    function openReel(postId) {
      const post = state.posts.find(p => p.id === postId);
      if (post && post.type === 'video') {
        state.activeReel = post;
        renderApp();
      }
    }

    function closeReel() {
      state.activeReel = null;
      renderApp();
    }

    function openDMWith(userName) {
      if (!state.currentUser || state.currentUser.name === userName) return;
      const targetMember = state.members.find(m => m.name.toLowerCase() === userName.toLowerCase());
      if (targetMember) {
        state.activeDMUser = targetMember;
        state.activeTab = 'dm';
        renderApp();
      }
    }

    function sendDMMessage(e) {
      e.preventDefault();
      const input = document.getElementById('dm-input');
      const text = input.value.trim();
      if (!text || !state.activeDMUser) return;

      const newDm = {
        id: Date.now(),
        sender: state.currentUser.name,
        receiver: state.activeDMUser.name,
        text: text,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      state.directMessages.push(newDm);
      saveState();
      renderApp();
      setTimeout(() => {
        const dmBox = document.getElementById('dm-container');
        if (dmBox) dmBox.scrollTop = dmBox.scrollHeight;
      }, 50);
    }

    function saveProfileEdit(e) {
      e.preventDefault();
      const newBio = document.getElementById('profile-bio-input').value.trim();
      if (state.currentUser) {
        state.currentUser.bio = newBio || "Vintage Member";
        const member = state.members.find(m => m.name.toLowerCase() === state.currentUser.name.toLowerCase());
        if (member) member.bio = state.currentUser.bio;
        saveState();
        addLog(`Profile updated by ${state.currentUser.name}`);
        alert("Profile updated successfully!");
        renderApp();
      }
    }

    function sendVoiceNoteSimulated() {
      const audioTexts = ["🎙️ Voice note (0:05)", "🎙️ Audio message (0:12)", "🎙️ Voice clip (0:08)"];
      const randomAudio = audioTexts[Math.floor(Math.random() * audioTexts.length)];
      
      const newMsg = {
        id: Date.now(),
        sender: state.currentUser.name,
        role: state.currentUser.role,
        text: randomAudio,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        avatar: state.currentUser.avatar
      };

      state.messages.push(newMsg);
      saveState();
      renderApp();
    }

    function closeStory() {
      state.activeStoryModal = null;
      renderApp();
    }

    function triggerStoryUpload() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const cap = prompt("Story ka caption likhein (Optional):");
            const newStory = {
              id: Date.now(),
              author: state.currentUser.name,
              avatar: state.currentUser.avatar,
              image: event.target.result,
              caption: cap || "Vintage Spotlight"
            };
            state.stories.unshift(newStory);
            saveState();
            addLog(`New Photo Story added by ${state.currentUser.name}`);
            renderApp();
          };
          reader.readAsDataURL(file);
        }
      };
      input.click();
    }

    // --- CREATE POST / VIDEO MODAL LOGIC ---
    function openCreateModal() {
      state.showCreateModal = true;
      renderApp();
    }

    function closeCreateModal() {
      state.showCreateModal = false;
      renderApp();
    }

    function handleCreateContent(type) {
      if (type === 'text') {
        const text = prompt("Apna Text Status / Post likhein:");
        if (!text) return;
        saveNewPost(text, null, "text");
      } else if (type === 'photo') {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (ev) => {
              const cap = prompt("Photo post ka description/caption likhein:");
              saveNewPost(cap || "", ev.target.result, "image");
            };
            reader.readAsDataURL(file);
          }
        };
        input.click();
      } else if (type === 'video') {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'video/*';
        input.onchange = (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (ev) => {
              const cap = prompt("Video / Reel ka description likhein:");
              saveNewPost(cap || "", ev.target.result, "video");
            };
            reader.readAsDataURL(file);
          }
        };
        input.click();
      }
    }

    function saveNewPost(content, mediaData, postType) {
      const newPost = {
        id: Date.now(),
        author: state.currentUser.name,
        avatar: state.currentUser.avatar,
        role: state.currentUser.role,
        timestamp: "Just now",
        content: content,
        type: postType,
        media: mediaData,
        likes: 0,
        likedByMe: false,
        comments: []
      };

      state.posts.unshift(newPost);
      state.showCreateModal = false;
      saveState();
      addLog(`New ${postType} created by ${state.currentUser.name}`);
      renderApp();
    }

    function toggleLike(postId) {
      const post = state.posts.find(p => p.id === postId);
      if (post) {
        post.likedByMe = !post.likedByMe;
        post.likes += post.likedByMe ? 1 : -1;
        saveState();
        renderApp();
      }
    }

    function addComment(e, postId) {
      e.preventDefault();
      const input = document.getElementById(`comment-input-${postId}`);
      const text = input.value.trim();
      if (!text) return;

      const post = state.posts.find(p => p.id === postId);
      if (post) {
        post.comments.push({
          id: Date.now(),
          author: state.currentUser.name,
          text: text,
          timestamp: "Just now"
        });
        saveState();
        renderApp();
      }
    }

    function deletePost(postId) {
      if (state.currentUser.role !== 'Admin') return;
      if (confirm("Admin Action: Delete this post?")) {
        state.posts = state.posts.filter(p => p.id !== postId);
        saveState();
        addLog(`Post ID ${postId} removed by Admin.`);
        renderApp();
      }
    }

    // --- CHAT LOGIC ---
    function sendChatMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      const newMsg = {
        id: Date.now(),
        sender: state.currentUser.name,
        role: state.currentUser.role,
        text: text,
        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        avatar: state.currentUser.avatar
      };

      state.messages.push(newMsg);
      saveState();
      renderApp();
      setTimeout(() => {
        const chatBox = document.getElementById('chat-container');
        if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
      }, 50);
    }

    // --- ADMIN CONTROLS ---
    function toggleUserRole(memberId) {
      if (state.currentUser.role !== 'Admin') return;
      const member = state.members.find(m => m.id === memberId);
      if (!member) return;
      member.role = member.role === 'Admin' ? 'Member' : 'Admin';
      saveState();
      addLog(`Member '${member.name}' role updated to ${member.role}`);
      renderApp();
    }

    function toggleUserStatus(memberId) {
      if (state.currentUser.role !== 'Admin') return;
      const member = state.members.find(m => m.id === memberId);
      if (!member) return;
      member.status = member.status === 'Active' ? 'Suspended' : 'Active';
      
      // If currently logged-in user gets suspended, force logout immediately
      if (state.currentUser && state.currentUser.name.toLowerCase() === member.name.toLowerCase() && member.status === 'Suspended') {
        state.currentUser = null;
      }

      saveState();
      addLog(`Member '${member.name}' status set to ${member.status}`);
      renderApp();
    }

    function blockUser(memberId) {
      if (state.currentUser.role !== 'Admin') return;
      const member = state.members.find(m => m.id === memberId);
      if (!member) return;
      if (confirm(`Block ${member.name} completely from accessing Vintage?`)) {
        state.blockedList.push(member.name.toLowerCase());
        
        // If currently logged-in user is blocked, kick them out immediately
        if (state.currentUser && state.currentUser.name.toLowerCase() === member.name.toLowerCase()) {
          state.currentUser = null;
        }

        state.members = state.members.filter(m => m.id !== memberId);
        saveState();
        addLog(`User '${member.name}' was PERMANENTLY BLOCKED by Admin.`);
        renderApp();
      }
    }

    function unblockName(name) {
      if (state.currentUser.role !== 'Admin') return;
      state.blockedList = state.blockedList.filter(n => n !== name);
      saveState();
      addLog(`User '${name}' unblocked.`);
      renderApp();
    }

    // --- RENDER MAIN LAYOUT ---
    function renderApp() {
      const container = document.getElementById('app');

      if (state.currentUser) {
        const isBlocked = state.blockedList.includes(state.currentUser.name.toLowerCase());
        const memberInfo = state.members.find(m => m.name.toLowerCase() === state.currentUser.name.toLowerCase());
        const isSuspended = memberInfo && memberInfo.status === 'Suspended';

        if (isBlocked || isSuspended) {
          state.currentUser = null;
          saveState();
        }
      }

      if (!state.currentUser) {
        container.innerHTML = renderLoginScreen();
        return;
      }

      const unreadCount = state.notifications.filter(n => !n.read).length;

      container.innerHTML = `
        <div class="flex flex-col h-full bg-[#050806] relative">
          <!-- TOP BRAND HEADER & SPOTLIGHT STORIES BAR -->
          <header class="bg-obsidian border-b border-obsidian-border shrink-0 z-20">
            <div class="px-4 py-3 flex items-center justify-between">
              <div class="flex items-center space-x-2 cursor-pointer" onclick="switchTab('feed')">
                <div class="w-8 h-8 rounded-xl bg-obsidian-deep border border-emerald-glow/40 flex items-center justify-center text-emerald-glow shadow-glow-sm">
                  <i class="fa-solid fa-gem text-base"></i>
                </div>
                <h1 class="font-extrabold text-white text-lg tracking-wider">VINTAGE</h1>
              </div>

              <!-- HEADER ACTIONS (NOTIFICATION BELL + LOGOUT) -->
              <div class="flex items-center space-x-3">
                <!-- NOTIFICATION BELL ICON -->
                <div class="relative">
                  <button onclick="toggleNotifications()" class="p-1.5 text-gray-300 hover:text-emerald-glow transition relative">
                    <i class="fa-solid fa-bell text-lg"></i>
                    ${unreadCount > 0 ? `
                      <span class="absolute -top-1 -right-1 w-4 h-4 bg-emerald-glow text-obsidian-deep text-[9px] font-bold rounded-full flex items-center justify-center shadow-glow-sm">
                        ${unreadCount}
                      </span>
                    ` : ''}
                  </button>

                  <!-- NOTIFICATION DROPDOWN POPUP -->
                  ${state.showNotifications ? `
                    <div class="absolute right-0 mt-2 w-72 sm:w-80 bg-obsidian-card border border-emerald-glow/40 rounded-2xl shadow-glow-lg p-3 z-50 space-y-2">
                      <div class="flex items-center justify-between border-b border-obsidian-border pb-2">
                        <span class="text-xs font-bold text-white font-mono">Notifications</span>
                        <span class="text-[9px] text-emerald-glow">${state.notifications.length} alerts</span>
                      </div>
                      <div class="max-h-56 overflow-y-auto space-y-2 no-scrollbar">
                        ${state.notifications.length > 0 ? state.notifications.map(n => `
                          <div class="p-2 rounded-xl bg-obsidian-deep border border-obsidian-border text-[11px] space-y-0.5">
                            <p class="text-gray-200">${n.text}</p>
                            <span class="text-[9px] text-gray-500 font-mono">${n.time}</span>
                          </div>
                        `).join('') : '<p class="text-xs text-gray-500 text-center py-2">No notifications yet</p>'}
                      </div>
                    </div>
                  ` : ''}
                </div>

                <span class="text-[10px] font-mono px-2.5 py-1 rounded-full ${state.currentUser.role === 'Admin' ? 'bg-emerald-glow/20 text-emerald-glow border border-emerald-glow/40 font-bold' : 'bg-gray-800 text-gray-400'}">
                  ${state.currentUser.role}
                </span>
                <button onclick="handleLogout()" class="p-1.5 text-gray-400 hover:text-red-400 transition text-sm" title="Logout">
                  <i class="fa-solid fa-right-from-bracket"></i>
                </button>
              </div>
            </div>

            <!-- INSTAGRAM / SPOTLIGHT STORIES CIRCLE BAR -->
            ${renderSpotlightsBar()}
          </header>

          <!-- MAIN TAB CONTENT CONTAINER -->
          <main class="flex-1 overflow-y-auto p-4 md:p-6 pb-24 relative">
            ${renderActiveTabContent()}
          </main>

          <!-- BOTTOM ACTION NAVIGATION BAR -->
          ${renderBottomTabBar()}

          <!-- STORY MODAL IF ACTIVE -->
          ${state.activeStoryModal ? renderStoryModal() : ''}

          <!-- CREATE POST FLOATING MODAL -->
          ${state.showCreatePostModal ? renderCreatePostModal() : ''}

          <!-- FULL-SCREEN REELS MODAL -->
          ${state.activeReel ? renderFullScreenReelModal() : ''}
        </div>
      `;
    }

    // --- INSTAGRAM-STYLE SPOTLIGHT STORIES BAR ---
    function renderSpotlightsBar() {
      return `
        <div class="px-4 py-2 border-t border-obsidian-border/50 bg-obsidian-deep/50 overflow-x-auto no-scrollbar flex items-center space-x-4">
          <!-- Add Story Button -->
          <button onclick="triggerStoryUpload()" class="flex flex-col items-center space-y-1 shrink-0 group">
            <div class="w-12 h-12 rounded-full border-2 border-dashed border-emerald-glow/60 flex items-center justify-center text-emerald-glow bg-obsidian-card group-hover:scale-105 transition shadow-glow-sm">
              <i class="fa-solid fa-camera text-sm"></i>
            </div>
            <span class="text-[10px] text-emerald-glow font-mono font-medium">Add Story</span>
          </button>

          <!-- Stories Feed -->
          ${state.stories.map(story => `
            <button onclick="openStory(${story.id})" class="flex flex-col items-center space-y-1 shrink-0 group">
              <div class="w-12 h-12 rounded-full p-0.5 border-2 border-emerald-glow bg-obsidian-deep group-hover:scale-105 transition shadow-glow-sm">
                <img src="${story.avatar}" class="w-full h-full rounded-full object-cover">
              </div>
              <span class="text-[10px] text-gray-300 font-mono truncate max-w-[60px]">${story.author}</span>
            </button>
          `).join('')}
        </div>
      `;
    }

    // --- LOGIN SCREEN TEMPLATE ---
    function renderLoginScreen() {
      return `
        <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-[#050806] via-[#0B0F0E] to-[#02281b] relative overflow-hidden">
          <div class="absolute -top-32 -left-32 w-96 h-96 bg-emerald-muted/20 rounded-full blur-3xl pointer-events-none"></div>
          <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-emerald-glow/10 rounded-full blur-3xl pointer-events-none"></div>

          <div class="w-full max-w-md bg-obsidian-card/90 border border-obsidian-border rounded-2xl p-8 shadow-2xl relative z-10 emerald-glow-border backdrop-blur-xl">

    // --- ROUTER FOR ACTIVE TAB ---
    function renderActiveTabContent() {

          return renderChatSection();

    // --- SECTION 1: FEEDS & VIDEO ---
    function renderFeedSection() {
      return `
        <div class="max-w-2xl mx-auto space-y-6">
          <div class="space-y-5">
            ${state.posts.map(post => `
              <div class="bg-obsidian-card border border-obsidian-border rounded-2xl p-4 sm:p-5 space-y-4 shadow-md">
                <!-- Header -->
                <div class="flex items-center justify-between">
                  <div class="flex items-center space-x-3 cursor-pointer" onclick="openDMWith('${post.author}')">

                      <div class="flex items-center space-x-2">

                <!-- Text -->
                ${post.content ? `<p class="text-xs sm:text-sm text-gray-200 leading-relaxed">${post.content}</p>` : ''}

                <!-- Media Preview (Video Reel / Photo) -->
                ${post.media ? `
                  <div class="rounded-xl overflow-hidden border border-obsidian-border bg-obsidian-deep relative group">
                    ${post.type === 'video' ? `
                      <div class="relative cursor-pointer" onclick="openReel(${post.id})">

                          <source src="${post.media}">

    // --- SECTION 2: SQUAD CHAT (WITH VOICE NOTE SIMULATION) ---
    function renderChatSection() {
      return `

          <!-- Chat Header -->
          <div class="p-3.5 border-b border-obsidian-border bg-obsidian flex items-center justify-between">

          <form onsubmit="sendChatMessage(event)" class="p-3 border-t border-obsidian-border bg-obsidian flex items-center space-x-2">

            </button>
          </form>
        </div>

    }

    // --- SECTION 3: PRIVATE DIRECT MESSAGES (DM) ---
    function renderDMSection() {
      if (!state.activeDMUser) {
        return `<div class="text-center py-12 text-gray-500 font-mono text-xs">Select a member profile to start private chat.</div>`;
      }
      const target = state.activeDMUser;
      const conversation = state.directMessages.filter(m => 
        (m.sender === state.currentUser.name && m.receiver === target.name) ||
        (m.sender === target.name && m.receiver === state.currentUser.name)
      );

      return `
        <div class="h-[calc(100vh-210px)] max-w-4xl mx-auto flex flex-col rounded-2xl border border-emerald-glow/30 bg-obsidian-card overflow-hidden shadow-glow-sm">
          <!-- DM Header -->
          <div class="p-3.5 border-b border-obsidian-border bg-obsidian flex items-center justify-between">
            <div class="flex items-center space-x-3">
              <img src="${target.avatar}" class="w-8 h-8 rounded-full border border-emerald-glow/40">
              <div>
                <h3 class="text-xs font-bold text-white flex items-center space-x-1.5">
                  <span>${target.name}</span>
                  <span class="text-[9px] bg-emerald-glow/20 text-emerald-glow px-1.5 rounded font-mono">DM</span>
                </h3>
                <p class="text-[9px] text-gray-400 font-mono">${target.bio || 'Vintage Member'}</p>

          <div id="dm-container" class="flex-1 overflow-y-auto p-4 space-y-3">
            ${conversation.map(m => {
              const isMe = m.sender === state.currentUser.name;
              return `
                <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                  <div class="max-w-[75%] p-3 rounded-2xl text-xs space-y-1 ${
                    isMe 
                      ? 'bg-emerald-glow/20 border border-emerald-glow/40 text-white rounded-br-none'
                      : 'bg-obsidian-deep border border-obsidian-border text-gray-200 rounded-bl-none'

                    <p>${m.text}</p>

              <i class="fa-solid fa-paper-plane"></i>
            </button>
          </form>
        </div>
      `;
    }

                    <div class="flex items-center justify-between p-3 rounded-xl bg-obsidian-deep border border-obsidian-border text-xs">

    // --- FULL SCREEN REELS MODAL ---
    function renderFullScreenReelModal() {

    // --- CREATE POST MODAL ---
    function toggleCreatePostModal(show) {
      state.showCreatePostModal = show;
      renderApp();
    }

    function createPost(e) {
      e.preventDefault();
      const text = document.getElementById('modal-post-text').value.trim();
      const fileInput = document.getElementById('modal-post-media-file');
      const isVideo = document.getElementById('modal-post-is-video').checked;
      const file = fileInput.files[0];

      if (!text && !file) return;

      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          saveNewPost(text, ev.target.result, isVideo ? 'video' : 'image');
          toggleCreatePostModal(false);
        };
        reader.readAsDataURL(file);
      } else {
        saveNewPost(text, null, 'text');
        toggleCreatePostModal(false);
      }
    }

    function renderCreatePostModal() {
      return `
        <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div class="w-full max-w-lg bg-obsidian-card border border-emerald-glow/40 rounded-2xl p-5 space-y-4 shadow-glow-lg">
            <div class="flex items-center justify-between border-b border-obsidian-border pb-3">
              <h3 class="text-sm font-bold text-white flex items-center space-x-2">
                <i class="fa-solid fa-square-plus text-emerald-glow"></i>
                <span>Create New Post or Video</span>
              </h3>
              <button onclick="toggleCreatePostModal(false)" class="text-gray-400 hover:text-white text-lg font-bold">
                &times;
              </button>
            </div>

            <div class="grid grid-cols-3 gap-2 pb-2">
              <button onclick="handleCreateContent('video')" class="p-3 rounded-xl border border-emerald-glow/30 bg-obsidian-deep hover:bg-emerald-glow/10 text-center transition">
                <i class="fa-solid fa-video text-emerald-glow text-lg block mb-1"></i>
                <span class="text-[11px] font-medium text-white">Post Reels</span>
              </button>
              <button onclick="handleCreateContent('photo')" class="p-3 rounded-xl border border-emerald-glow/30 bg-obsidian-deep hover:bg-emerald-glow/10 text-center transition">
                <i class="fa-solid fa-image text-emerald-glow text-lg block mb-1"></i>
                <span class="text-[11px] font-medium text-white">Post Photos</span>
              </button>
              <button onclick="handleCreateContent('text')" class="p-3 rounded-xl border border-emerald-glow/30 bg-obsidian-deep hover:bg-emerald-glow/10 text-center transition">
                <i class="fa-solid fa-font text-emerald-glow text-lg block mb-1"></i>
                <span class="text-[11px] font-medium text-white">Text Update</span>
              </button>
            </div>

            <form onsubmit="createPost(event)" class="space-y-4 border-t border-obsidian-border pt-3">
              <div>
                <label class="block text-xs font-mono text-gray-400 mb-1">Caption / Thoughts</label>
                <textarea id="modal-post-text" rows="3" placeholder="Share something cool with Vintage..."
                  class="w-full bg-obsidian-deep border border-obsidian-border rounded-xl p-3 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-emerald-glow resize-none"></textarea>
              </div>

              <div>
                <label class="block text-xs font-mono text-gray-400 mb-1">Select Media File</label>
                <input type="file" id="modal-post-media-file" accept="image/*,video/*"
                  class="w-full bg-obsidian-deep border border-obsidian-border rounded-xl p-2 text-xs text-gray-400 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-glow file:text-obsidian-deep hover:file:bg-emerald-accent">
              </div>

              <div class="flex items-center space-x-2 pt-1">
                <input type="checkbox" id="modal-post-is-video" class="accent-emerald-glow rounded w-4 h-4">
                <label for="modal-post-is-video" class="text-xs text-gray-300 font-mono">This media is a Video file</label>
              </div>

              <div class="flex justify-end space-x-3 pt-2">
                <button type="button" onclick="toggleCreatePostModal(false)" class="px-4 py-2 bg-obsidian-deep text-gray-400 text-xs rounded-xl border border-obsidian-border">
                  Cancel
                </button>
                <button type="submit" class="px-5 py-2 bg-emerald-glow text-obsidian-deep text-xs font-bold rounded-xl shadow-glow-sm hover:bg-emerald-accent transition">
                  Publish Post
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    // --- SECTION 3: PROFILE & ADMIN PANEL ---
    function renderProfileAndAdminSection() {
      const u = state.currentUser;
      return `
        <div class="max-w-2xl mx-auto space-y-6">
          <!-- Profile Card -->
          <div class="bg-obsidian-card border border-obsidian-border rounded-2xl p-5 shadow-lg flex flex-col sm:flex-row items-center space-y-4 sm:space-y-0 sm:space-x-5">
            <img src="${u.avatar}" class="w-20 h-20 rounded-2xl border-2 border-emerald-glow p-1 bg-obsidian shadow-glow-sm">
            <div class="text-center sm:text-left space-y-1">
              <div class="flex items-center justify-center sm:justify-start space-x-2">
                <h2 class="text-lg font-bold text-white">${u.name}</h2>
                <span class="text-xs font-mono px-2.5 py-0.5 rounded-full ${u.role === 'Admin' ? 'bg-emerald-glow/20 text-emerald-glow border border-emerald-glow/40' : 'bg-gray-800 text-gray-400'}">
                  ${u.role}
                </span>
              </div>
              <p class="text-xs text-gray-400 font-mono">ID: ${u.id}</p>
            </div>
          </div>

          <!-- ADMIN PANEL (Visible ONLY for Admin Role) -->
          ${u.role === 'Admin' ? `
            <div class="bg-obsidian-card border border-emerald-glow/30 rounded-2xl p-5 space-y-4 shadow-glow-sm">
              <div class="flex items-center space-x-2 text-emerald-glow border-b border-obsidian-border pb-3">
                <i class="fa-solid fa-user-shield text-lg"></i>
                <h3 class="text-sm font-bold tracking-wide uppercase font-mono">Admin Command Center</h3>
              </div>

              <!-- Registered Squad Members -->
              <div class="space-y-3">
                <h4 class="text-xs font-mono text-gray-400 uppercase">Squad Members Management</h4>
                <div class="space-y-2">
                  ${state.members.map(m => `
                    <div class="flex items-center justify-between p-3 rounded-xl bg-obsidian-deep border border-obsidian-border text-xs">
                      <div class="flex items-center space-x-3">
                        <img src="${m.avatar}" class="w-8 h-8 rounded-full bg-obsidian">
                        <div>
                          <div class="flex items-center space-x-2">
                            <span class="font-bold text-white">${m.name}</span>
                            <span class="text-[9px] font-mono px-1.5 py-0.5 rounded ${m.role === 'Admin' ? 'bg-emerald-glow/20 text-emerald-glow' : 'bg-gray-800 text-gray-400'}">${m.role}</span>
                          </div>
                          <span class="text-[10px] ${m.status === 'Active' ? 'text-emerald-glow' : 'text-red-400'}">${m.status}</span>
                        </div>
                      </div>

                      <div class="flex items-center space-x-2">
                        <button onclick="toggleUserRole('${m.id}')" class="px-2 py-1 bg-obsidian border border-obsidian-border hover:border-emerald-glow/40 text-gray-300 rounded font-mono text-[10px]">
                          ${m.role === 'Admin' ? 'Demote' : 'Promote'}
                        </button>
                        <button onclick="toggleUserStatus('${m.id}')" class="px-2 py-1 bg-obsidian border border-obsidian-border hover:border-amber-500/40 text-amber-300 rounded font-mono text-[10px]">
                          ${m.status === 'Active' ? 'Suspend' : 'Activate'}
                        </button>
                        <button onclick="blockUser('${m.id}')" class="px-2 py-1 bg-red-950/40 border border-red-800/40 hover:bg-red-900/40 text-red-400 rounded font-mono text-[10px]">
                          Block
                        </button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- Blocked Users List -->
              ${state.blockedList.length > 0 ? `
                <div class="space-y-2 pt-2 border-t border-obsidian-border">
                  <h4 class="text-xs font-mono text-red-400 uppercase">Blocked Users (${state.blockedList.length})</h4>
                  <div class="flex flex-wrap gap-2">
                    ${state.blockedList.map(name => `
                      <span class="inline-flex items-center space-x-1 px-2.5 py-1 bg-red-950/30 border border-red-800/40 text-red-300 rounded-lg text-xs font-mono">
                        <span>${name}</span>
                        <button onclick="unblockName('${name}')" class="hover:text-white ml-1">&times;</button>
                      </span>
                    `).join('')}
                  </div>
                </div>
              ` : ''}

              <!-- System Audit Logs -->
              <div class="space-y-2 pt-2 border-t border-obsidian-border">
                <h4 class="text-xs font-mono text-gray-400 uppercase">Audit Tracker Logs</h4>
                <div class="max-h-36 overflow-y-auto bg-obsidian-deep p-3 rounded-xl border border-obsidian-border font-mono text-[10px] space-y-1 text-gray-400">
                  ${state.logs.map(l => `
                    <div><span class="text-emerald-glow">[${l.time}]</span> ${l.text}</div>
                  `).join('')}
                </div>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    // --- SECTION 2: CHAT ---
    function renderChatSection() {
      return `
        <div class="h-[calc(100vh-210px)] max-w-4xl mx-auto flex flex-col rounded-2xl border border-obsidian-border bg-obsidian-card overflow-hidden shadow-xl">
          <!-- Chat Header -->
          <div class="p-3.5 border-b border-obsidian-border bg-obsidian flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
              <span class="w-2.5 h-2.5 rounded-full bg-emerald-glow animate-ping"></span>
              <div>
                <h3 class="text-xs font-bold text-white"># Vintage Squad Chat</h3>
                <p class="text-[10px] text-gray-400 font-mono">${state.members.length} registered members</p>
              </div>
            </div>
          </div>

          <!-- Messages stream -->
          <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-3">
            ${state.messages.map(msg => {
              const isMe = msg.sender === (state.currentUser ? state.currentUser.name : '');
              return `
                <div class="flex items-start space-x-2.5 ${isMe ? 'flex-row-reverse space-x-reverse' : ''}">
                  <img src="${msg.avatar}" class="w-7 h-7 rounded-full border border-emerald-glow/30 bg-obsidian shrink-0">
                  <div class="max-w-[80%] space-y-1">
                    <div class="flex items-center space-x-2 ${isMe ? 'justify-end' : ''}">
                      <span class="text-[11px] font-semibold text-gray-300">${msg.sender}</span>
                      <span class="text-[9px] text-gray-500 font-mono">${msg.timestamp}</span>
                    </div>
                    <div class="p-3 rounded-2xl text-xs leading-relaxed ${
                      isMe 
                        ? 'bg-emerald-dark/50 border border-emerald-glow/30 text-white rounded-tr-none' 
                        : 'bg-obsidian-deep border border-obsidian-border text-gray-200 rounded-tl-none'
                    }">
                      ${msg.text}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <!-- Chat Input -->
          <form onsubmit="sendChatMessage(event)" class="p-3 border-t border-obsidian-border bg-obsidian flex items-center space-x-2">
            <input type="text" id="chat-input" placeholder="Type a message to squad..." required autocomplete="off"
              class="flex-1 bg-obsidian-deep border border-obsidian-border rounded-xl px-4 py-2.5 text-xs text-white placeholder-gray-600 focus:outline-none focus:border-emerald-glow">
            <button type="submit" class="px-4 py-2.5 bg-emerald-glow text-obsidian-deep font-bold text-xs rounded-xl shadow-glow-sm hover:bg-emerald-accent transition">
              <i class="fa-solid fa-paper-plane"></i>
            </button>
          </form>
        </div>
      `;
    }

    // --- STORY VIEWER MODAL ---
    function renderStoryModal() {
      const s = state.activeStoryModal;
      if (!s) return '';
      return `
        <div class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
          <div class="w-full max-w-sm bg-obsidian-card border border-emerald-glow/40 rounded-3xl overflow-hidden shadow-glow-lg flex flex-col relative">
            <div class="p-3 flex items-center justify-between border-b border-obsidian-border bg-obsidian/80">
              <div class="flex items-center space-x-2.5">
                <img src="${s.avatar}" class="w-7 h-7 rounded-full border border-emerald-glow/40">
                <span class="text-xs font-bold text-white">${s.author}</span>
              </div>
              <button onclick="closeStory()" class="text-gray-400 hover:text-white px-2 text-lg font-bold">
                &times;
              </button>
            </div>
            <div class="relative bg-black flex items-center justify-center min-h-[350px]">
              <img src="${s.image}" class="w-full max-h-[480px] object-contain">
            </div>
            ${s.caption ? `<div class="p-3 bg-obsidian text-center text-xs text-emerald-glow font-medium">${s.caption}</div>` : ''}
          </div>
        </div>
      `;
    }

    // --- INITIAL APP LAUNCH ---
    window.onload = function() {
      renderApp();
    };
  </script>
</body>
</html>
